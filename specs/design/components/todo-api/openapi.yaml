openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
servers:
  - url: /
paths:
  /me/todos:
    get:
      operationId: listMyTodos
      summary: The caller's todos, newest first
      security:
        - oauth2: [todos:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the caller's todos
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Todo' }
        '401':
          description: Not signed in or missing permission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyTodo
      summary: Add a todo for the caller
      security:
        - oauth2: [todos:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTodo' }
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400':
          description: Empty or invalid title
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in or missing permission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/todos/{todoId}/done:
    post:
      operationId: completeMyTodo
      summary: Mark the caller's todo done
      security:
        - oauth2: [todos:complete]
      parameters:
        - { name: todoId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Todo marked done (already-done stays done)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '401':
          description: Not signed in or missing permission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such todo for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            todos:read: See own todos
            todos:create: Add a todo
            todos:complete: Mark own todo done
  schemas:
    Todo:
      type: object
      required: [id, title, done, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        done: { type: boolean }
        createdAt: { type: string, format: date-time }
    NewTodo:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, description: short text, must not be blank }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
